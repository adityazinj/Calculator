<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link href="/src/input.css" rel="stylesheet">
  
</head>
<body>
  <div class="p-10 flex flex-col items-center">
    <div class="bg-black h-[475px] w-[300px]  rounded-2xl p-5 flex flex-col gap-4">
      <div class="border-solid">
        <input type="text" class="w-64 bg-black text-white h-14 rounded-xl border-2 text-right ip">
      </div>

      <div class="grid grid-cols-4 h-10 w-60 gap-5 mr-10">
        <button class="h-14 w-14 p-4  border-2 bg-gray-400 rounded-full ac">AC</button>
        <button class="h-14 w-14 p-4  border-2 bg-gray-400 rounded-full del">DEL</button>
        <button class="h-14 w-14 p-4  border-2 bg-gray-400 rounded-full mod">%</button>
        <button class="h-14 w-14 p-4  border-2 bg-orange-500 rounded-full text-white divi">/</button>
        <button class="h-14 w-14 p-4  border-2 rounded-full text-white seven">7</button>
        <button class="h-14 w-14 p-4   border-2 rounded-full text-white eight">8</button>
        <button class="h-14 w-14 p-4  border-2 rounded-full text-white nine">9</button>
        <button class="h-14 w-14 p-4  border-2 bg-orange-500 rounded-full text-white multip">*</button>
        <button class="h-14 w-14 p-4  border-2 rounded-full text-white four">4</button>
        <button class="h-14 w-14 p-4  border-2 rounded-full text-white five">5</button>
        <button class="h-14 w-14 p-4  border-2 rounded-full text-white six">6</button>
        <button class="h-14 w-14 p-4  border-2 bg-orange-500 rounded-full text-white subs">-</button>
        <button class="h-14 w-14 p-4  border-2 rounded-full text-white one">1</button>
        <button class="h-14 w-14 p-4  border-2 rounded-full text-white two">2</button>
        <button class="h-14 w-14 p-4  border-2 rounded-full text-white three">3</button>
        <button class="h-14 w-14 p-4  border-2 bg-orange-500 rounded-full text-white additi">+</button>
        <button class="h-14 w-14 p-4  border-2 rounded-full text-white szero">0</button>
        <button class="h-14 w-14 p-4  border-2 rounded-full text-white dzero">00</button>
        <button class="h-14 w-14 p-4  border-2 rounded-full text-white dot">.</button>
        <button class="h-14 w-14 p-4  border-2 bg-orange-500 rounded-full text-white equal">=</button>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
