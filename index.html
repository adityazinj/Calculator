<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link href="/src/input.css" rel="stylesheet">
  
</head>
<body>
  <div class="p-10">
    <div class="bg-black h-[475px] w-[25%] rounded-2xl p-5 flex flex-col gap-4">
      <div class="border-solid">
        <input type="text" class="w-64 bg-black text-white h-14 rounded-xl border-2">
      </div>

      <div class="grid grid-cols-4 h-10 w-60 gap-5 mr-10">
        <button class="h-14 w-14 p-4  border-2 bg-gray-400 rounded-full">AC</button>
        <button class="h-14 w-14 p-4  border-2 bg-gray-400 rounded-full">DEL</button>
        <button class="h-14 w-14 p-4  border-2 bg-gray-400 rounded-full">%</button>
        <button class="h-14 w-14 p-4  border-2 bg-orange-500 rounded-full text-white">/</button>
        <button class="h-14 w-14 p-4  border-2 rounded-full text-white">7</button>
        <button class="h-14 w-14 p-4   border-2 rounded-full text-white">8</button>
        <button class="h-14 w-14 p-4  border-2 rounded-full text-white">9</button>
        <button class="h-14 w-14 p-4  border-2 bg-orange-500 rounded-full text-white">*</button>
        <button class="h-14 w-14 p-4  border-2 rounded-full text-white">4</button>
        <button class="h-14 w-14 p-4  border-2 rounded-full text-white">5</button>
        <button class="h-14 w-14 p-4  border-2 rounded-full text-white">6</button>
        <button class="h-14 w-14 p-4  border-2 bg-orange-500 rounded-full text-white">-</button>
        <button class="h-14 w-14 p-4  border-2 rounded-full text-white">1</button>
        <button class="h-14 w-14 p-4  border-2 rounded-full text-white">2</button>
        <button class="h-14 w-14 p-4  border-2 rounded-full text-white">3</button>
        <button class="h-14 w-14 p-4  border-2 bg-orange-500 rounded-full text-white">+</button>
        <button class="h-14 w-14 p-4  border-2 rounded-full text-white">0</button>
        <button class="h-14 w-14 p-4  border-2 rounded-full text-white">00</button>
        <button class="h-14 w-14 p-4  border-2 rounded-full text-white">.</button>
        <button class="h-14 w-14 p-4  border-2 bg-orange-500 rounded-full text-white">=</button>

      </div>
    </div>
  </div>
</body>
</html>
